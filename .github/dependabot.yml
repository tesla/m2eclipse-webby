version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      tycho:
        patterns:
          - "org.eclipse.tycho*"
    ignore:
      # 3.3+ needs libraries the m2e Maven runtime does not provide
      - dependency-name: "org.apache.maven.shared:maven-filtering"
      # the tests use one Tomcat per major version (tomcat10.version, tomcat11.version)
      - dependency-name: "org.apache.tomcat:tomcat"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "maven"
    directories:
      - "/plugins/org.sonatype.m2e.webby"
      - "/tests/org.sonatype.m2e.webby.test"
    schedule:
      interval: "weekly"
    ignore:
      # 3.3+ needs libraries the m2e Maven runtime does not provide
      - dependency-name: "org.apache.maven.shared:maven-filtering"
      # the tests use one Tomcat per major version (tomcat10.version, tomcat11.version)
      - dependency-name: "org.apache.tomcat:tomcat"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
